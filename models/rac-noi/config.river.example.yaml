# Run from aiot-stream-cv/: python run.py --config models/rac-noi/config.river.example.yaml
# One source per clip; zone water_surface = the water area, event_type foreign_object, any floating thing counts.
# For the 1280 model: weights rac-noi_n1280.pt and imgsz: 1280.
sources:
  - id: lake
    uri: "data/river_lake.mp4"
    realtime: true
    zones:
      - id: water_surface
        event_type: foreign_object
        polygon: [[0, 0], [1280, 0], [1280, 721], [0, 721]]
        min_dwell_s: 1.0
        lost_timeout_s: 2.0
        classes: [floating_waste, river_vegetation]
  - id: canal
    uri: "data/river_canal.mp4"
    realtime: true
    zones:
      - id: water_surface
        event_type: foreign_object
        polygon: [[0, 507], [413, 220], [667, 167], [1280, 147], [1280, 721], [0, 721]]
        min_dwell_s: 1.0
        lost_timeout_s: 2.0
        classes: [floating_waste, river_vegetation]
  - id: murky
    uri: "data/river_murky.mp4"
    realtime: true
    zones:
      - id: water_surface
        event_type: foreign_object
        polygon: [[0, 0], [1280, 0], [1280, 675], [0, 675]]
        min_dwell_s: 1.0
        lost_timeout_s: 2.0
        classes: [floating_waste, river_vegetation]
  - id: bottle
    uri: "data/river_bottle.mp4"
    realtime: true
    zones:
      - id: water_surface
        event_type: foreign_object
        polygon: [[0, 0], [1280, 0], [1280, 721], [0, 721]]
        min_dwell_s: 1.0
        lost_timeout_s: 2.0
        classes: [floating_waste, river_vegetation]
  - id: mixkit_25556
    uri: "data/river_mixkit_25556.mp4"
    realtime: true
    zones:
      - id: water_surface
        event_type: foreign_object
        polygon: [[0, 0], [1280, 0], [1280, 721], [0, 721]]
        min_dwell_s: 1.0
        lost_timeout_s: 2.0
        classes: [floating_waste, river_vegetation]
  - id: mixkit_25549
    uri: "data/river_mixkit_25549.mp4"
    realtime: true
    zones:
      - id: water_surface
        event_type: foreign_object
        polygon: [[0, 0], [1280, 0], [1280, 721], [0, 721]]
        min_dwell_s: 1.0
        lost_timeout_s: 2.0
        classes: [floating_waste, river_vegetation]
  - id: mixkit_25541
    uri: "data/river_mixkit_25541.mp4"
    realtime: true
    zones:
      - id: water_surface
        event_type: foreign_object
        polygon: [[0, 0], [1280, 0], [1280, 721], [0, 721]]
        min_dwell_s: 1.0
        lost_timeout_s: 2.0
        classes: [floating_waste, river_vegetation]
model: {enabled: true, async: true, weights: "models/rac-noi/rac-noi_n640.pt", classes: null, conf: 0.35, imgsz: 640, device: null}
stream: {buffer_size: 4, reconnect_initial_s: 1.0, reconnect_max_s: 30.0, stale_after_s: 3.0, offline_grace_s: 10.0}
events: {dir: "output/river", clip: true, clip_pre_s: 2.0, clip_post_s: 2.0}
api: {host: 127.0.0.1, port: 8095}
