# Container configuration: bundled sample video, CPU inference, API reachable by Nginx.
sources:
  - id: cam01
    uri: data/vtest.avi
    loop: true
    realtime: true
    zones:
      - id: restricted_a
        polygon: [[380, 215], [560, 215], [580, 330], [360, 330]]
        min_dwell_s: 1.0
        lost_timeout_s: 2.0
        classes: [person]
    # Wastewater analyzers on the bundled sample video, so the dashboard receives foam_coverage and
    # overflow out of the box. The regions are PLACEHOLDERS (lawn with litter, footpath): the numbers mean
    # nothing for a tank (foam ~2 %, a person crossing changes ~5 % of the "tray", below on_ratio, so
    # normally no overflow event). For the demo tank use scripts/pick_roi.py and docs/analyzers.md.
    analyzers:
      foam_coverage:
        roi: [[20, 360], [300, 360], [300, 560], [20, 560]]
        colors: [white, brown, grey, shadow]
        calibrate: first_frames
        darker_than_local: 10
        brighter_than_local: 8
      overflow:
        zone_id: tray_front
        roi: [[100, 240], [380, 240], [380, 300], [100, 300]]
        cooldown_s: 30
  # Intentionally offline source for demonstrating reconnect and health events.
  - id: cam02_offline
    uri: rtsp://127.0.0.1:8554/not-running

model:
  weights: yolov8n.pt
  classes: [0]
  conf: 0.35
  imgsz: 640
  device: cpu

stream:
  buffer_size: 4
  reconnect_initial_s: 1.0
  reconnect_max_s: 30.0
  stale_after_s: 3.0
  offline_grace_s: 10.0

events:
  dir: output
  clip: true
  clip_pre_s: 5.0
  # Disabled by default. Set positive limits to expire old evidence, keeping event history.
  retention_days: null
  max_evidence_mb: null
  cleanup_interval_s: 3600
  clip_post_s: 5.0

api:
  host: 0.0.0.0
  port: 8080
