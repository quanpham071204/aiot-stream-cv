name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # the tests use fake captures, so the model stack (ultralytics, torch) is not needed
      - run: pip install opencv-python-headless numpy pyyaml -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
