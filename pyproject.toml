[project]
name = "aiot-stream-cv"
version = "0.2.0"
description = "Data streaming and computer vision block for an industrial AI monitoring framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3",
    "lap>=0.5",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["aiot"]
