# Wastewater tank demo: webcam over the demo box, foam % + overflow, YOLO off the main loop.
#   python run.py --config config.analyzers.example.yaml --show
# Pixel coordinates below are placeholders: measure them on a frame from your camera.
sources:
  - id: tank01
    uri: "0"                    # USB webcam; or a video file / rtsp:// URL
    zones:
      # foreign objects: anything the model detects on the tank surface for min_dwell_s -> one foreign_object
      # event per object (snapshot + clip). Same corners as foam_coverage.roi is fine.
      - id: tank_surface
        event_type: foreign_object
        polygon: [[120, 80], [520, 80], [560, 400], [80, 400]]
        min_dwell_s: 1.0
        lost_timeout_s: 2.0
        # the team's model (Dat): its foreign-object class names. With the stock yolov8n.pt (COCO) use objects
        # that float, e.g. [bottle, cup, sports ball, frisbee, handbag, backpack, umbrella]; null = every class
        classes: [bottle, cup, sports ball, frisbee, handbag, backpack, umbrella]
    analyzers:
      foam_coverage:
        enabled: true
        roi: [[120, 80], [520, 80], [560, 400], [80, 400]]   # tank surface corners, clockwise from top-left
        colors: [white, brown, grey, shadow]  # HSV presets in aiot/analyzers/foam.py; grey/shadow need a tight ROI
        smooth_alpha: 0.3
        calibrate: first_frames     # learn the water brightness from the first frames (start on a calm, foam-free tank);
                                    # or a path to a clean-tank photo from this camera; remove to turn off
        calibrate_frames: 10
        darker_than_local: 10        # drop colour matches >10 levels darker than their surroundings (brown/grey water
                                    # between foam); remove to turn off
        brighter_than_local: 8       # also count fairly colourless spots brighter than their surroundings (dull
                                    # grey-brown foam veins on dark water); remove to turn off
        kernel_px: 5                # speckle filter; use 3 when the camera is far and foam lines are thin
      overflow:
        enabled: true
        zone_id: tray_front
        roi: [[80, 410], [560, 410], [560, 470], [80, 470]]  # dark drip tray outside the tank wall
        diff_thresh: 30
        on_ratio: 0.15
        off_ratio: 0.05
        confirm_frames: 3
        cooldown_s: 30

model:
  enabled: true                 # false = no object detection (foam/overflow only)
  async: true                   # YOLO in its own thread; OpenCV analyzers keep the full frame rate
  weights: yolov8n.pt
  classes: null
  conf: 0.35
  imgsz: 640
  device: null

stream:
  buffer_size: 4
  reconnect_initial_s: 1.0
  reconnect_max_s: 30.0
  stale_after_s: 3.0
  offline_grace_s: 10.0

events:
  dir: output
  clip: true
  clip_pre_s: 5.0
  clip_post_s: 5.0

api:
  host: 127.0.0.1
  port: 8080
